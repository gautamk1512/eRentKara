{% load i18n static %}

<div class="border-b border-base-200 dark:border-base-800 flex flex-col p-3.5 mb-2 bg-white dark:bg-base-900">
    <div class="flex items-center justify-between gap-2.5">
        <a href="{% url 'admin:index' %}" class="flex items-center gap-3 group grow min-w-0 no-underline">
            <!-- Brand Logo Icon -->
            <div style="width: 38px; height: 38px; min-width: 38px; background: linear-gradient(135deg, #0f172a 0%, #0071e3 100%); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #ffffff; box-shadow: 0 4px 12px rgba(0,113,227,0.25);" class="shrink-0 transition-transform group-hover:scale-105">
                <svg style="width: 22px; height: 22px; stroke: #ffffff; fill: none;" viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
            </div>
            <!-- Brand Title -->
            <div class="flex flex-col min-w-0">
                <div class="flex items-center gap-1.5">
                    <span class="text-[16px] font-extrabold tracking-tight text-slate-900 dark:text-white leading-none">
                        eRent<span class="text-[#0071e3]">Karar</span>
                    </span>
                    <span style="font-size: 9px; font-weight: 800; background-color: rgba(0,113,227,0.1); color: #0071e3; border: 1px solid rgba(0,113,227,0.25); padding: 1px 5px; border-radius: 4px; letter-spacing: 0.05em; text-transform: uppercase;">
                        ADMIN
                    </span>
                </div>
                <span class="text-[11px] text-slate-500 dark:text-slate-400 font-medium truncate mt-1">
                    Rental OS & Legal Agreements
                </span>
            </div>
        </a>

        <!-- Mobile close button -->
        <span class="material-symbols-outlined block cursor-pointer text-slate-400 hover:text-slate-700 dark:hover:text-white xl:!hidden" x-on:click="sidebarMobileOpen = !sidebarMobileOpen">
            close
        </span>
    </div>

    <!-- Quick Website Jump Bar inside sidebar -->
    <div class="mt-3 pt-2.5 border-t border-slate-100 dark:border-base-800 flex items-center justify-between text-[11px]">
        <span class="text-slate-400 dark:text-slate-500 font-medium">Live Website:</span>
        <a href="http://localhost:3000/" target="_blank" rel="noopener noreferrer" 
           style="display: inline-flex; align-items: center; gap: 4px; color: #0071e3; font-weight: 600; text-decoration: none;"
           class="hover:underline">
            <span>erentkarar.com</span>
            <span class="material-symbols-outlined" style="font-size: 13px;">open_in_new</span>
        </a>
    </div>
</div>
